name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every cell finish, so one failure doesn't hide the state of the rest.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        # Django 5.2 LTS: what production runs since hop 6 (2026-11-19)
        django-version: ["5.2"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements.txt is not installed here: it is the /srv pin file
        # (one Python tier's exact versions plus an editable ../../core/ttcal
        # checkout), which a GitHub runner can't satisfy. Django and ttcal
        # come from setup.py; numpy is only needed by the tests.
        pip install numpy pytest coverage pytest-cov pytest-django
        pip install -U Django~=${{ matrix.django-version }}.0
        pip install -e .
        pip list

    - name: Run tests
      run: |
        pytest -v --cov=dkjason --cov-report=xml tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
